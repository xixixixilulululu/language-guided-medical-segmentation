# DD-CMD (Phase 1). Read by src/phase1/train_ddcmd.py.
# Source: DD-CMD official repository (external/DD-CMD, commit 27387c4): config/train.yaml, train.py,
# net/creratemodel.py (LightningModule, used unchanged), net/model.py, utils/dataset.py.
method: ddcmd
model:
  vision_type: facebook/convnext-tiny-224                                   # HF, fine-tuned
  bert_type: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext  # HF, frozen
input_size: [224, 224]
input_text_len: 24               # tokenizer max_length, padding to max_length, truncation

# Training (config/train.yaml, train.py, creratemodel.py); identical for both datasets
lr: 5.0e-5                       # AdamW (default weight decay), CosineAnnealingLR(T_max 200, eta_min 1e-6) per epoch
loss: DiceCELoss(sigmoid=True)   # MONAI, default 1:1 weights
train_batch_size: 8
valid_batch_size: 8
min_epochs: 1
max_epochs: 160
patience: 50                     # Lightning EarlyStopping(patience=50, mode=max)
precision: 32                    # Trainer default

# Deviations (decisions of 2026-10-18):
# D3: checkpoint selection AND early stopping monitor the mean per-case validation Dice of the common
#     evaluator (prob > 0.5) instead of the official val_MIoU (a pixel-pooled IoU over the epoch).
monitor: val_case_dice
# D6 (revised 2026-10-19): 0 data-loader workers, the official value (train.py hard-codes num_workers=0).
#     8 workers forked by Lightning hung before any worker started (quick-check job 317, diagnostic job 319);
#     see reports/PHASE1_MODEL_SETUP.md. The MONAI transforms are seeded in the main process and their random
#     states are stored in every checkpoint, so a resumed segment continues the same augmentation stream.
num_workers: 0
# Seed: 1001/1002/1003 instead of the hard-coded set_seed(42); not deterministic (as official).
deterministic: false
# Input: the common 224x224 images and masks (as all Phase 0/1 methods), so the official Resized transforms
# are the identity. Arrays are fed in (H, W) orientation; the official PILReader yields (W, H) (transposed),
# which only mirrors the image, and every augmentation (zoom, rotation +-0.3 rad, flips on both axes,
# rot90) is symmetric under transposition, so the training distribution is unchanged.
# Logging: CSVLogger only (tensorboard is not installed; logging does not affect training).
val_batch_size_eval: 32          # final inference only
